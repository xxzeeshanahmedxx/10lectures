<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Visualization</title>
<style>
    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Arial, sans-serif;
        background: #fff;
        color: #222;
        overflow: hidden;
    }

    .container {
        text-align: center;
        position: relative;
    }

    h1 {
        font-size: 20px;
        font-weight: 500;
        margin-bottom: 8px;
    }

    p {
        font-size: 13px;
        color: #777;
        margin-bottom: 18px;
    }

    button {
        border: 1px solid #ccc;
        background: #fafafa;
        padding: 8px 16px;
        border-radius: 6px;
        font-size: 13px;
        cursor: pointer;
        animation: pulse 1.4s infinite;
    }

    @keyframes pulse {
        0%, 100% {
            transform: scale(1);
        }

        50% {
            transform: scale(1.05);
        }
    }

    button:active {
        transform: scale(0.97);
    }

    #laugh {
        position: fixed;
        left: 50%;
        top: 38%;
        transform: translate(-50%, -50%) scale(0);
        font-size: 84px;
        line-height: 1;
        pointer-events: none;
        opacity: 0;
        z-index: 10;
        filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.12));
    }

    #laugh.pop {
        animation: laughPop 0.6s cubic-bezier(0.2, 1.5, 0.35, 1) forwards;
    }

    @keyframes laughPop {
        0% {
            opacity: 0;
            transform: translate(-50%, -50%) scale(0) rotate(-18deg);
        }
        65% {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1.22) rotate(8deg);
        }
        100% {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1) rotate(0deg);
        }
    }
</style>
</head>
<body>
<div class="container">
    <h1>Data Visualization</h1>
    <p>Run the analysis to view the results.</p>
    <button id="run" type="button">Run Analysis</button>
</div>
<div id="laugh" aria-hidden="true">😂</div>
<audio id="clip" src="chicken-on-tree-screaming.mp3?v=2" preload="auto"></audio>
<script>
const audioUrl = "chicken-on-tree-screaming.mp3?v=2";
const audio = document.getElementById("clip");
const laugh = document.getElementById("laugh");

function popLaugh() {
    laugh.classList.remove("pop");
    void laugh.offsetWidth;
    laugh.classList.add("pop");
}

async function playClip() {
    audio.pause();
    if (!audio.src || !audio.src.includes("chicken-on-tree-screaming.mp3")) {
        audio.src = audioUrl;
    }
    try {
        audio.currentTime = 0;
    } catch (e) {}
    try {
        await audio.play();
        return;
    } catch (err) {
        console.warn("Retrying audio load:", err);
    }
    audio.src = audioUrl;
    audio.load();
    await new Promise((resolve, reject) => {
        const ok = () => { cleanup(); resolve(); };
        const fail = () => { cleanup(); reject(new Error("audio error")); };
        const cleanup = () => {
            audio.removeEventListener("canplaythrough", ok);
            audio.removeEventListener("canplay", ok);
            audio.removeEventListener("error", fail);
        };
        audio.addEventListener("canplaythrough", ok, { once: true });
        audio.addEventListener("canplay", ok, { once: true });
        audio.addEventListener("error", fail, { once: true });
    });
    await audio.play();
}

document.getElementById("run").addEventListener("click", async () => {
    popLaugh();
    try {
        await playClip();
    } catch (err) {
        console.error("Could not play audio:", err);
        new Audio(audioUrl).play().catch((e) => console.error("Fallback play failed:", e));
    }
});
</script>
</body>
</html>
