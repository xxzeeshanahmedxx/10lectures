<title>Data Visualization</title>
<style>
    body {

        justify-content: center;
        font-family: Arial, sans-serif;
        background: #fff;
        color: #222;
    }

        text-align: center;
    }

        font-weight: 500;
        margin-bottom: 8px;
    }

    p {
        font-size: 13px;
        color: #777;
        margin-bottom: 18px;
    }

    button {
        border: 1px solid #ccc;
        background: #fafafa;
        padding: 8px 16px;
        border-radius: 6px;
        font-size: 13px;
        cursor: pointer;
        animation: pulse 1.4s infinite;
    }

    @keyframes pulse {
        0%, 100% {
            transform: scale(1);
        }

        50% {
            transform: scale(1.05);
        }
    }

    button:active {
        transform: scale(0.97);
    }
</style>
</head>

let audioContext = null;
let audioBuffer = null;
let resolvedUrl = audioSources[audioSources.length - 1];
let rawData = null;

function getContext() {
    if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
    }
    return audioContext;
}

function decodeAudio(ctx, data) {
    const copy = data.slice(0);
    try {
        const maybe = ctx.decodeAudioData(copy);
        if (maybe && typeof maybe.then === "function") {
            return maybe;
        }
    } catch (err) {
        // Older WebKit requires the callback form.
    }
    return new Promise((resolve, reject) => {
        ctx.decodeAudioData(data.slice(0), resolve, reject);
    });
}

async function fetchRaw(url) {
    const response = await fetch(url);
    if (!response.ok) throw new Error("HTTP " + response.status);
    return await response.arrayBuffer();
}

async function preloadRaw() {
    if (rawData) return rawData;
    const urls = [audioSources[0], audioSources[1]];
    for (const url of urls) {
        try {
            rawData = await fetchRaw(url);
            resolvedUrl = url;
            return rawData;
        } catch (err) {
            console.warn("Could not load", url, err);
        }
    }
    throw new Error("Could not load audio");
}

async function ensureBuffer() {
    if (audioBuffer) return audioBuffer;
    const data = await preloadRaw();
    const ctx = getContext();
    audioBuffer = await decodeAudio(ctx, data);
    return audioBuffer;
}

function playWithHtmlAudio() {
    const url = resolvedUrl;
    const playOne = () => {
        const el = new Audio(url);
        const p = el.play();
        if (p && p.catch) p.catch((err) => console.error("Audio play failed:", err));
    };
    playOne();
    for (let i = 1; i < 5; i++) {
        setTimeout(playOne, i * 200);
    }
}

function playWithWebAudio(ctx, buffer) {
    const startTime = ctx.currentTime + 0.05;
    const interval = 0.2;
    for (let i = 0; i < 5; i++) {
        const source = ctx.createBufferSource();
        source.buffer = buffer;
        source.connect(ctx.destination);
        source.start(startTime + (i * interval));
    }
}

document.getElementById("run").addEventListener("click", async () => {
    const ctx = getContext();
    try {
        if (ctx.state === "suspended") {
            await ctx.resume();
        }
        // Unlock audio immediately inside the click gesture.
        const silent = ctx.createBuffer(1, 1, ctx.sampleRate);
        const unlock = ctx.createBufferSource();
        unlock.buffer = silent;
        unlock.connect(ctx.destination);
        unlock.start();

        const buffer = await ensureBuffer();
        if (ctx.state === "suspended") {
            await ctx.resume();
        }
        playWithWebAudio(ctx, buffer);
    } catch (err) {
        console.error("Could not play with Web Audio, falling back:", err);
        playWithHtmlAudio();
    }
});

preloadRaw().catch(() => {});
