<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Visualization</title>
<style>
    * { box-sizing: border-box; }

    html, body {
        margin: 0;
        height: 100%;
    }

    body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Georgia, "Times New Roman", serif;
        background: #f4f1ea;
        color: #1a1a1a;
    }

    .page {
        text-align: center;
        padding: 24px;
        position: relative;
        z-index: 2;
    }

    .stamp {
        display: inline-block;
        border: 1px solid #7a1f2b;
        color: #7a1f2b;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 10px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        padding: 4px 8px;
        margin-bottom: 18px;
        font-weight: 700;
    }

    h1 {
        font-size: 26px;
        font-weight: 500;
        margin: 0 0 10px;
        letter-spacing: -0.02em;
    }

    p {
        font-size: 14px;
        color: #666;
        margin: 0 0 22px;
    }

    button {
        appearance: none;
        border: 1px solid #0c1c33;
        background: #0c1c33;
        color: #f4f1ea;
        padding: 12px 22px;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 13px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        cursor: pointer;
    }

    button:hover { background: #162844; }

    .funny { display: none; }

    #laugh {
        position: fixed;
        left: 50%;
        top: 22%;
        transform: translate(-50%, -50%) scale(0);
        font-size: 84px;
        line-height: 1;
        pointer-events: none;
        opacity: 0;
        z-index: 5;
    }

    #chicken {
        position: fixed;
        left: 50%;
        bottom: 8%;
        width: min(280px, 55vw);
        transform: translateX(-50%);
        pointer-events: none;
        z-index: 1;
        opacity: 0;
    }

    html.chaos body {
        font-family: "Comic Sans MS", "Comic Sans", cursive;
        background: #ffe14a;
    }

    html.chaos .serious { display: none; }
    html.chaos .funny { display: inline; }
    html.chaos h1 .funny { display: inline; }
    html.chaos p .funny { display: inline; }
    html.chaos button .funny { display: inline; }

    html.chaos .stamp {
        border-color: #d10b64;
        color: #d10b64;
    }

    html.chaos h1 {
        color: #d10b64;
    }

    html.chaos button {
        background: #d10b64;
        border-color: #000;
        font-family: "Comic Sans MS", "Comic Sans", cursive;
        text-transform: none;
        letter-spacing: 0;
        font-size: 16px;
        font-weight: 700;
    }

    html.chaos #chicken {
        opacity: 1;
    }

    html.chaos #laugh.pop {
        animation: laughPop 0.55s cubic-bezier(0.2, 1.5, 0.35, 1) forwards;
    }

    @keyframes laughPop {
        0% { opacity: 0; transform: translate(-50%, -50%) scale(0); }
        70% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
        100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    }
</style>
</head>
<body>
<div class="page">
    <div class="stamp">
        <span class="serious">Confidential</span>
        <span class="funny">Gotcha</span>
    </div>
    <h1>
        <span class="serious">Data Visualization</span>
        <span class="funny">It was a chicken</span>
    </h1>
    <p>
        <span class="serious">Run the analysis to view the results.</span>
        <span class="funny">Please do not tell the committee.</span>
    </p>
    <button id="run" type="button">
        <span class="serious">Run Analysis</span>
        <span class="funny">Run it back</span>
    </button>
</div>

<div id="laugh" aria-hidden="true">😂</div>
<img id="chicken" src="chicken-chaos.png" alt="">
<audio id="clip" src="chicken-on-tree-screaming.mp3?v=2" preload="auto"></audio>

<script>
const audioUrl = "chicken-on-tree-screaming.mp3?v=2";
const audio = document.getElementById("clip");
const laugh = document.getElementById("laugh");

document.getElementById("run").addEventListener("click", async () => {
    document.documentElement.classList.add("chaos");
    document.title = "It was a chicken";
    laugh.classList.remove("pop");
    void laugh.offsetWidth;
    laugh.classList.add("pop");

    try {
        audio.pause();
        audio.currentTime = 0;
        await audio.play();
    } catch (err) {
        new Audio(audioUrl).play().catch(() => {});
    }
});
</script>
</body>
</html>
