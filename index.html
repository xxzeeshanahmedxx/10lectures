<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Visualization</title>
<style>
    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Arial, sans-serif;
        background: #fff;
        color: #222;
    }

    .container {
        text-align: center;
    }

    h1 {
        font-size: 20px;
        font-weight: 500;
        margin-bottom: 8px;
    }

    p {
        font-size: 13px;
        color: #777;
        margin-bottom: 18px;
    }

    button {
        border: 1px solid #ccc;
        background: #fafafa;
        padding: 8px 16px;
        border-radius: 6px;
        font-size: 13px;
        cursor: pointer;
        animation: pulse 1.4s infinite;
    }

    @keyframes pulse {
        0%, 100% {
            transform: scale(1);
        }

        50% {
            transform: scale(1.05);
        }
    }

    button:active {
        transform: scale(0.97);
    }
</style>
</head>
<body>
<div class="container">
    <h1>Data Visualization</h1>
    <p>Run the analysis to view the results.</p>
    <button id="run" type="button">Run Analysis</button>
</div>
<audio id="clip" src="chicken-on-tree-screaming.mp3" preload="auto"></audio>
<script>
const audio = document.getElementById("clip");

document.getElementById("run").addEventListener("click", async () => {
    try {
        audio.pause();
        audio.currentTime = 0;
        await audio.play();
    } catch (err) {
        console.error("Could not play audio:", err);
        const fallback = new Audio("chicken-on-tree-screaming.mp3");
        fallback.play().catch((e) => console.error("Fallback play failed:", e));
    }
});
</script>
</body>
</html>
